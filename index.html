<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Northern Syria DCS Scoreboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #101820;
    color: #ffffff;
    text-align: center;
}

header {
    background: #17232e;
    padding: 30px 20px;
    border-bottom: 3px solid #d4af37;
}

h1 {
    margin: 0;
    font-size: 36px;
}

.subtitle {
    color: #d4af37;
    margin-top: 8px;
    font-size: 18px;
}

.status {
    margin: 40px auto;
    max-width: 700px;
    padding: 30px;
    background: #17232e;
    border-radius: 12px;
}

.online {
    color: #57d957;
    font-size: 22px;
    font-weight: bold;
}

footer {
    margin-top: 50px;
    color: #888;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>NORTHERN SYRIA</h1>
    <div class="subtitle">DCS SEEK & DESTROY — MULTIPLAYER SCOREBOARD</div>
</header>

<div class="status">

    <h2>LIVE CAMPAIGN SCOREBOARD</h2>

    <p class="online">● ONLINE</p>

    <p>
        Scoreboard connection successful.
    </p>

    <p>
        Live pilot statistics will appear here automatically.
    </p>

</div>

<footer>
    Northern Syria DCS Multiplayer Campaign
</footer>

</body>
</html>
